name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# WPF/WindowsDesktop target framework requires a Windows runner (SAD §81, Implementation Plan §95).
jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Darhous.Archive.slnx

      - name: Build
        run: dotnet build Darhous.Archive.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Darhous.Archive.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
